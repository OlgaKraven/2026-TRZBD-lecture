<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img"><title>Каждая заявка имеет ровно одного родителя каждого вида; у родителя может быть 0..N заявок.</title><style>text{font:22px Arial,sans-serif;fill:#17232d}.title{font-weight:bold;font-size:25px}.edge{font-size:19px}</style><rect width="1400" height="700" fill="#f6f7f9"/><path d="M370 115H640V265H850" stroke="#df001b" stroke-width="3" fill="none"/><rect x="437" y="74" width="235" height="28" fill="#f6f7f9"/><text x="445" y="96" class="edge">1 ← 0..N: client_id</text><path d="M370 325H850" stroke="#df001b" stroke-width="3" fill="none"/><rect x="462" y="292" width="235" height="28" fill="#f6f7f9"/><text x="470" y="314" class="edge">1 ← 0..N: branch_id</text><path d="M370 535H660V375H850" stroke="#df001b" stroke-width="3" fill="none"/><rect x="432" y="502" width="235" height="28" fill="#f6f7f9"/><text x="440" y="524" class="edge">1 ← 0..N: status_id</text><g><rect x="40" y="40" width="330" height="150" rx="12" fill="#fff" stroke="#263746" stroke-width="2"/><path d="M41 83h328" stroke="#df001b" stroke-width="3"/><text x="58" y="69" class="title">clients</text><text x="58" y="112">PK id</text><text x="58" y="139">UK code</text><text x="58" y="166">name</text></g><g><rect x="40" y="250" width="330" height="150" rx="12" fill="#fff" stroke="#263746" stroke-width="2"/><path d="M41 293h328" stroke="#df001b" stroke-width="3"/><text x="58" y="279" class="title">branches</text><text x="58" y="322">PK id</text><text x="58" y="349">UK code</text><text x="58" y="376">name</text></g><g><rect x="40" y="460" width="330" height="150" rx="12" fill="#fff" stroke="#263746" stroke-width="2"/><path d="M41 503h328" stroke="#df001b" stroke-width="3"/><text x="58" y="489" class="title">request_statuses</text><text x="58" y="532">PK id</text><text x="58" y="559">UK code</text><text x="58" y="586">name</text></g><g><rect x="850" y="190" width="480" height="255" rx="12" fill="#fff" stroke="#263746" stroke-width="2"/><path d="M851 233h478" stroke="#df001b" stroke-width="3"/><text x="868" y="219" class="title">requests</text><text x="868" y="262">PK id; UK request_no</text><text x="868" y="289">FK client_id NOT NULL</text><text x="868" y="316">FK branch_id NOT NULL</text><text x="868" y="343">FK status_id NOT NULL</text><text x="868" y="370">received_at NOT NULL</text></g><text x="35" y="670" style="font-size:21px">Каждая заявка имеет ровно одного родителя каждого вида; у родителя может быть 0..N заявок.</text></svg>
