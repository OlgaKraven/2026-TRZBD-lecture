</text><text x="1108" y="159">UK code</text></g><g><rect x="520" y="425" width="350" height="180" rx="12" fill="#fff" stroke="#263746" stroke-width="2"/><path d="M521 468h348" stroke="#df001b" stroke-width="3"/><text x="538" y="454" class="title">completed_works</text><text x="538" y="497">PK/FK request_id</text><text x="538" y="524">PK/FK work_code</text></g><g><rect x="1090" y="440" width="280" height="150" rx="12" fill="#fff" stroke="#263746" stroke-width="2"/><path d="M1091 483h278" stroke="#df001b" stroke-width="3"/><text x="1108" y="469" class="title">work_types</text><text x="1108" y="512">PK code</text><text x="1108" y="539">name</text></g><text x="35" y="670" style="font-size:21px">Составной PK ограничивает пару; каждый компонент одновременно ссылается на своего родителя.</text></svg>
